# Decap CMS configuration.
#
# GitHub backend auth goes through a self-hosted OAuth provider (a
# Cloudflare Worker) — see workers/decap-oauth/README.md for setup.
# base_url below must match wherever that worker ends up deployed.

backend:
  name: github
  repo: martim0t0/marcinjaszczuk_com
  branch: main
  base_url: https://decap-oauth.martim0t0.workers.dev # TODO: set after deploying workers/decap-oauth
site_url: https://marcinjaszczuk.com
display_url: https://marcinjaszczuk.com

# Static export means there is no server to serve media through Next's
# image optimizer, so uploads just land in public/images and are served
# as plain static files.
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: text

      - label: Publication Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: Author
        name: author
        widget: string
        default: "Marcin"

      - label: Tags
        name: tags
        widget: list
        default: []

      - label: Featured Image
        name: image
        widget: image
        required: false

      - label: Published
        name: published
        widget: boolean
        default: true

      - label: Body
        name: body
        widget: markdown
