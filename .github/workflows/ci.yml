name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Validate content
        run: bun run validate-content

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://marcinjaszczuk.com
