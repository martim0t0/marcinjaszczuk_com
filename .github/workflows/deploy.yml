name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Validate content
        run: bun run validate-content

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          # Custom domain (see public/CNAME) — always served at the root,
          # so NEXT_PUBLIC_BASE_PATH is intentionally left unset.
          NEXT_PUBLIC_SITE_URL: https://marcinjaszczuk.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
